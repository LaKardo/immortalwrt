name: Build Netcraze NC-1012

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v25.12.2-nc1012.* tag to build and publish (empty = branch build)'
        type: string
        default: ''
  push:
    tags:
      - 'v25.12.2-nc1012.*'

permissions:
  contents: write
  actions: write

concurrency:
  group: nc1012-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch on shared cache branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run build-nc1012.yml --repo "$REPO" \
            --ref nc1012-25.12 -f release_tag="$RELEASE_TAG"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v25\.12\.2-nc1012\.[0-9]+$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time

      - name: Restore download cache
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: nc1012-dl-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nc1012-dl-v2-${{ runner.os }}-

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: nc1012-ccache-v2-${{ runner.os }}-${{ hashFiles('toolchain/**', 'tools/ccache/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nc1012-ccache-v2-${{ runner.os }}-${{ hashFiles('toolchain/**', 'tools/ccache/**') }}-

      - name: Configure feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cp configs/nc-1012.seed .config
          make defconfig
          grep -qx 'CONFIG_CCACHE=y' .config
          mkdir -p "$CCACHE_DIR"
          grep -E 'TARGET_(mediatek|ROOTFS)|DEVICE_netcraze|CCACHE' .config | tee build-config.txt

      - name: Download sources
        run: make download -j"$(nproc)" V=s

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Compiler cache statistics
        if: always()
        run: |
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats | tee ccache-stats.txt
            cat ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save compiler cache even after failure
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save downloads even after failure
        if: always() && steps.downloads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Verify output
        run: |
          set -eux
          ls -lh bin/targets/mediatek/filogic/*nc-1012* \
            bin/targets/mediatek/filogic/sha256sums
          grep -q 'netcraze_nc-1012' bin/targets/mediatek/filogic/sha256sums
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1012*squashfs-factory.bin'
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1012*squashfs-sysupgrade.bin'

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcraze-nc-1012
          if-no-files-found: error
          retention-days: 90
          path: |
            bin/targets/mediatek/filogic/*nc-1012*
            build-config.txt
            bin/targets/mediatek/filogic/*.buildinfo
            bin/targets/mediatek/filogic/sha256sums

      - name: Publish GitHub release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            bin/targets/mediatek/filogic/*nc-1012*
            build-config.txt
            bin/targets/mediatek/filogic/*.buildinfo
            bin/targets/mediatek/filogic/sha256sums
