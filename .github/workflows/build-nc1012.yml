name: Build Netcraze NC-1012 and NC-1812

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v25.12.2-netcraze.* tag to build and publish (empty = branch build)'
        type: string
        default: ''
  push:
    tags:
      - 'v25.12.2-netcraze.*'

permissions:
  contents: write
  actions: write

concurrency:
  group: netcraze-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch on shared cache branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run build-nc1012.yml --repo "$REPO" \
            --ref nc1012-25.12 -f release_tag="$RELEASE_TAG"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v25\.12\.2-netcraze\.[0-9]+$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time

      - name: Restore download cache
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: netcraze-dl-v3-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'include/kernel-*', 'package/**/Makefile', 'target/linux/**/Makefile', 'tools/**/Makefile', 'toolchain/**/Makefile') }}
          restore-keys: |
            netcraze-dl-v3-${{ runner.os }}-

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: netcraze-ccache-v3-${{ runner.os }}-${{ hashFiles('toolchain/**', 'tools/ccache/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            netcraze-ccache-v3-${{ runner.os }}-${{ hashFiles('toolchain/**', 'tools/ccache/**') }}-

      - name: Configure feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cp configs/netcraze.seed .config
          make defconfig
          grep -qx 'CONFIG_CCACHE=y' .config
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config
          for device in nc-1012 nc-1812; do
            grep -qx "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcraze_${device}=y" .config
            grep -qx "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_netcraze_${device}=\"kmod-amneziawg kmod-nft-socket\"" .config
          done
          for pkg in kmod-amneziawg kmod-nft-socket; do
            grep -qx "CONFIG_PACKAGE_${pkg}=y" .config
          done
          mkdir -p "$CCACHE_DIR"
          grep -E 'TARGET_(mediatek|ROOTFS|MULTI_PROFILE|PER_DEVICE_ROOTFS)|DEVICE_netcraze|CCACHE|PACKAGE_kmod-(amneziawg|nft-socket)' .config | tee build-config.txt
          # Toolchain cache key input: the resolved config without package
          # selection, so adding packages keeps the toolchain while any other
          # option (GCC, libc, optimisation, target) still invalidates it.
          grep -E '^CONFIG_' .config \
            | grep -vE '^CONFIG_(PACKAGE_|MODULE_|TARGET_DEVICE_PACKAGES_|DEFAULT_)' \
            | LC_ALL=C sort > toolchain-config.txt
          wc -l toolchain-config.txt

      - name: Restore host tools and toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: netcraze-toolchain-v1-${{ runner.os }}-${{ hashFiles('toolchain-config.txt', 'Makefile', 'rules.mk', 'include/**', 'tools/**', 'toolchain/**', 'target/linux/mediatek/Makefile', 'target/linux/mediatek/filogic/target.mk') }}

      # Checkout gives sources newer mtimes than restored stamps; refresh them so
      # OpenWrt reuses the toolchain whose sources are pinned by the cache key.
      - name: Mark restored toolchain as current
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          set -eux
          compgen -G 'staging_dir/host/stamp/.tools_compile_*'
          compgen -G 'staging_dir/toolchain-*/stamp/.toolchain_compile'
          find staging_dir/host/stamp staging_dir/toolchain-*/stamp -type f -exec touch {} +

      - name: Validate local patches
        run: |
          set -eux
          test -s package/kernel/mac80211/patches/subsys/400-wifi-mac80211-defer-ap-side-ft-key-upload.patch
          test -s package/network/services/hostapd/patches/022-hostapd-ft-readd-unassociated-sta-before-ptk.patch
          make package/kernel/mac80211/prepare V=s
          make package/network/services/hostapd/prepare V=s

      - name: Download sources
        id: download_sources
        run: make download -j"$(nproc)" V=s

      - name: Build firmware
        id: build_firmware
        run: make -j"$(nproc)" V=s

      - name: Compiler cache statistics
        if: always()
        run: |
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats | tee ccache-stats.txt
            cat ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save compiler cache even after build failure
        id: save_ccache
        if: always() && steps.ccache.outcome == 'success' && (steps.build_firmware.outcome == 'success' || steps.build_firmware.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Check toolchain cache contents
        id: toolchain_ready
        if: always() && steps.toolchain.outcome == 'success' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          if compgen -G 'staging_dir/host/stamp/.tools_compile_*' >/dev/null &&
             compgen -G 'staging_dir/toolchain-*/stamp/.toolchain_compile' >/dev/null; then
            echo ready=true >> "$GITHUB_OUTPUT"
          fi

      - name: Save host tools and toolchain
        id: save_toolchain
        if: always() && steps.toolchain_ready.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Save downloads
        id: save_downloads
        if: always() && steps.downloads.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true' && steps.download_sources.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Remove superseded caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CCACHE_KEY: ${{ steps.save_ccache.outcome == 'success' && steps.ccache.outputs.cache-primary-key || '' }}
          TOOLCHAIN_KEY: ${{ steps.save_toolchain.outcome == 'success' && steps.toolchain.outputs.cache-primary-key || '' }}
          DL_KEY: ${{ steps.save_downloads.outcome == 'success' && steps.downloads.outputs.cache-primary-key || '' }}
        run: |
          prune() {
            local prefix=$1 keep=$2
            [[ -n "$keep" ]] || return 0
            gh cache list --repo "$REPO" --key "$prefix" --limit 100 --json id,key \
              --jq ".[] | select(.key != \"$keep\") | .id" |
              while read -r id; do gh cache delete "$id" --repo "$REPO"; done
          }
          prune netcraze-ccache-v3- "$CCACHE_KEY"
          prune netcraze-toolchain-v1- "$TOOLCHAIN_KEY"
          prune netcraze-dl-v3- "$DL_KEY"

      - name: Verify output
        run: |
          set -eux
          ls -lh bin/targets/mediatek/filogic/*nc-1012* \
            bin/targets/mediatek/filogic/*nc-1812* \
            bin/targets/mediatek/filogic/sha256sums
          grep -q 'netcraze_nc-1012' bin/targets/mediatek/filogic/sha256sums
          grep -q 'netcraze_nc-1812' bin/targets/mediatek/filogic/sha256sums
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1012*squashfs-factory.bin'
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1012*squashfs-sysupgrade.bin'
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1812*squashfs-factory.bin'
          compgen -G 'bin/targets/mediatek/filogic/*netcraze_nc-1812*squashfs-sysupgrade.bin'

      - name: Verify kernel modules in images
        run: |
          set -euo pipefail
          for device in nc-1012 nc-1812; do
            img=$(compgen -G "bin/targets/mediatek/filogic/*netcraze_${device}-squashfs-sysupgrade.bin")
            work=$(mktemp -d)
            tar -xf "$img" -C "$work"
            staging_dir/host/bin/unsquashfs4 -no-progress -d "$work/rootfs" \
              "$work/sysupgrade-netcraze_${device}/root" \
              lib/modules lib/apk/db/installed >/dev/null
            for mod in amneziawg nft_socket udp_tunnel ip6_udp_tunnel; do
              [ -n "$(find "$work/rootfs/lib/modules" -name "${mod}.ko")" ] ||
                { echo "::error::${device}: ${mod}.ko missing"; exit 1; }
            done
            for pkg in kmod-amneziawg kmod-nft-socket; do
              grep -qx "P:${pkg}" "$work/rootfs/lib/apk/db/installed" ||
                { echo "::error::${device}: package ${pkg} not installed"; exit 1; }
            done
            echo "${device}: $(grep -A1 -x 'P:kernel' "$work/rootfs/lib/apk/db/installed" | sed -n 's/^V://p')" |
              tee -a kernel-versions.txt
            rm -rf "$work"
          done

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcraze-nc-1012-nc-1812
          if-no-files-found: error
          retention-days: 90
          path: |
            bin/targets/mediatek/filogic/*nc-1012*
            bin/targets/mediatek/filogic/*nc-1812*
            build-config.txt
            toolchain-config.txt
            kernel-versions.txt
            bin/targets/mediatek/filogic/*.buildinfo
            bin/targets/mediatek/filogic/sha256sums

      - name: Publish GitHub release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            bin/targets/mediatek/filogic/*nc-1012*
            bin/targets/mediatek/filogic/*nc-1812*
            build-config.txt
            kernel-versions.txt
            bin/targets/mediatek/filogic/*.buildinfo
            bin/targets/mediatek/filogic/sha256sums
